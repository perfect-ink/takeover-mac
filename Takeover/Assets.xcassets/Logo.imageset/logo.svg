<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3db4e4"/>
      <stop offset="0.45" stop-color="#1f74d4"/>
      <stop offset="1" stop-color="#0a2f7a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="1" stop-color="#a9b3c1"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe4eb"/>
      <stop offset="1" stop-color="#bcc5d1"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04163d" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#sh)">
  <!-- hinges -->
  <rect x="196" y="352" width="96" height="84" rx="22" fill="#8f9aab"/>
  <rect x="196" y="588" width="96" height="84" rx="22" fill="#8f9aab"/>
  <!-- round door -->
  <circle cx="530" cy="512" r="300" fill="url(#steel)" stroke="#7d899b" stroke-width="6"/>
  </g>
  <circle cx="530" cy="512" r="236" fill="url(#face)" stroke="#8f9aab" stroke-width="10"/>
  <!-- wheel -->
  <g stroke="#5b6778" stroke-linecap="round" fill="none">
    <circle cx="530" cy="512" r="118" stroke-width="30"/>
    <path d="M530 394V630M412 512H648" stroke-width="26"/>
  </g>
  <circle cx="530" cy="512" r="40" fill="#5b6778"/>
</svg>
