  # Music and audio
  # Plug-in installers write into the Audio folders as root, and failed when
  # they were links (into iCloud Drive or the local store). The Mac app keeps
  # every path under /Library/Audio and ~/Library/Audio a real folder and
  # copies it both ways with the synced copy instead of linking it, so the
  # whole Plug-Ins and Presets folders sync (Alex, 2026-11-18). Vendor recipes
  # below leave their Audio/Presets subfolders to these.
  - name: Audio Plug-Ins
    files:
      - name: Library Audio Plug-Ins
        path: /Library/Audio/Plug-Ins
      - name: User Audio Plug-Ins
        path: ~/Library/Audio/Plug-Ins
  - name: Audio Presets
    files:
      - name: Library Audio Presets
        path: /Library/Audio/Presets
      - name: User Audio Presets
        path: ~/Library/Audio/Presets
  # Ableton's Application Support folder also holds each Live version's
  # Unlock folder (machine-bound authorization), so only its Library is synced.
  # ~/Music/Ableton also holds Factory Packs (gigabytes of downloads Live
  # fetches again) and Live Recordings (takes from unsaved Sets), so only the
  # User Library (presets, templates, defaults, grooves) is synced.
  # ~/Library/Preferences/Ableton has one folder per Live version, mostly
  # transient state: logs, crash reports, undo history, the browser database,
  # and Preferences.cfg, which mixes recent documents, window layout and this
  # Mac's audio devices into one file. Only Options.txt (hand-written options)
  # and Library.cfg (User Library location and browser Places) are synced, one
  # location per installed version.
  # Themes live inside each Live app (Live 10 and later: Themes; Live 9:
  # Skins). The `*` matches every installed version and edition, and the Mac
  # app adds one location per match, putting the matched text where the
  # name has its `*` ("Ableton Live 12 Suite Themes").
  - name: Ableton Live
    files:
      - name: User Library
        path: ~/Music/Ableton/User Library
      - name: User Application Support Library
        path: ~/Library/Application Support/Ableton/Library
      - name: User Preferences Live * Options
        path: ~/Library/Preferences/Ableton/Live */Options.txt
      - name: User Preferences Live * Library
        path: ~/Library/Preferences/Ableton/Live */Library.cfg
      - name: Ableton Live * Themes
        path: /Applications/Ableton Live *.app/Contents/App-Resources/Themes
      - name: Ableton Live * Skins
        path: /Applications/Ableton Live *.app/Contents/App-Resources/Skins
