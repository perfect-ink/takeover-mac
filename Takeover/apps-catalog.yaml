# Takeover app catalog: the app configs the Mac app's Apps tab can add as
# Sync Settings. Served as a static file at https://takeoverapp.site/catalog/apps.yaml
# (and readable straight from GitHub). GET /api/v1/repository reads this file
# directly (app/models/catalog.rb), so editing it is all a change needs.
#
# Each path is moved into the sync folder and replaced by a symlink, so list
# only folders and files that work as symlinks: user config, presets and
# libraries. Leave out ~/Library/Preferences plists (cfprefsd replaces
# symlinked plists), sandboxed ~/Library/Containers paths, caches, browser
# profiles, files that mostly hold credentials, and license or activation
# data (moving it can deactivate a plug-in). When a vendor keeps its apps' settings under one company folder
# (Native Instruments, Ableton, Image-Line, JetBrains), sync the whole company
# folder rather than one app's subfolder. Exception: /Library/Application
# Support/Native Instruments stays a real folder, and each product folder in
# it is its own location, leaving out NTK and Service Center (licensing and
# activation, which NI's installers and Native Access manage).
#
# Location names follow the location, not the app: paths in ~/Library start
# with "User" ("User Application Support", "User Preferences"), paths in
# /Library start with "Library" ("Library Application Support"), and paths in
# ~/Documents or ~/Music may too ("User Documents"). Every other location is
# named for what it is ("SSH", "Zsh Config"), with no User or Library prefix.
# The Mac app keys locations by app and path, so renaming one offers Rename
# and Move.
#
# A path may use `*` for one path component's varying part, e.g. an app's
# version in its name; the Mac app adds one location per match on that Mac
# and puts the matched text where the location's name has its `*`.
#
# `os_recipies` keeps the old api/repository.json spelling; the Mac app
# decodes that key.
#
# `version` is this catalog's revision. Raise it by one in every change to
# this file: the Mac app keeps whichever copy (fetched, cached or bundled) has
# the highest version, and CI refuses a change that doesn't raise it
# (bin/check-catalog-versions).
version: 5

os_recipies:
  - name: Dock Orientation
    defaults: com.apple.dock orientation right
  - name: Dock Size
    defaults: com.apple.dock tilesize -integer 24

